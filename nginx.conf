# Bangla Basket -- nginx reverse proxy (parallel-test phase).
#
# The backend serves everything itself (REST API under /api, the Expo web
# bundle at /, uploaded images under /api/uploads, catalog images under
# /api/files/*), so nginx is a pure reverse proxy here.  TLS is NOT
# configured in this phase: the parallel stack is reached on port 8080
# (see docker-compose.yml) while the live nginx keeps 80/443.
#
# At cutover (future, separately approved step):
#   1. Change the published ports in docker-compose.yml to 80:80 + 443:443.
#   2. Add the TLS server block below (cert paths must match the live
#      certbot layout, e.g. /etc/letsencrypt/live/banglabasket.ca/, with
#      the ACME webroot at /var/www/letsencrypt as the live vhosts use).
#   3. Stop the live systemd service.  No DNS change: nginx keeps serving
#      banglabasket.ca on the same instance.
server {
    listen 80;
    server_name banglabasket.ca www.banglabasket.ca localhost;

    client_max_body_size 50m;

    location / {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
