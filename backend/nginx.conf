server {
    listen 80 default_server;
    server_name banglabasket.ca www.banglabasket.ca _;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /app/backend/nginx_locations.conf;
}

include /etc/nginx/bongconnekt-https/*.conf;
